# Vérifications utilisables dans les étapes d'un labo (`verif:`) et effets (`effet:`).
# Source unique : le validateur Python (formation/training/content.py) et le moteur JavaScript
# (static/js/checks.js) s'y réfèrent ; un test Jest s'assure qu'ils restent synchronisés.
#
# Une étape est validée dès que TOUTES ses vérifications sont vraies (au moment où l'apprenant
# tape une commande ou enregistre un fichier). Une fois validée, une étape le reste.

verifications:
  # ── Communes ──────────────────────────────────────────────────────────────
  commande:
    arguments: [regex]
    doc: "Une commande tapée correspond à l'expression régulière (testée sur chaque commande, début de ligne = `^`)."
  commande-compte:
    arguments: [regex, minimum]
    doc: "Au moins `minimum` commandes tapées correspondent à l'expression régulière."
  fichier-existe:
    arguments: [fichier]
    doc: "Le fichier existe dans le dossier de travail."
  fichier-absent:
    arguments: [fichier]
    doc: "Le fichier n'existe pas dans le dossier de travail."
  fichier-contient:
    arguments: [fichier, regex]
    doc: "Le contenu du fichier correspond à l'expression régulière (mode multiligne)."
  fichier-ne-contient-pas:
    arguments: [fichier, regex]
    doc: "Le contenu du fichier ne correspond pas à l'expression régulière."
  fichier-modifie:
    arguments: [fichier]
    doc: "Le contenu du fichier diffère de celui du début du labo."
  session-fermee:
    doc: "L'apprenant n'est plus dans une session interactive de conteneur (il a tapé `exit`)."
    moteurs: [docker]

  # ── Git ───────────────────────────────────────────────────────────────────
  depot-initialise:
    doc: "`git init` a été exécuté."
    moteurs: [git]
  indexe:
    arguments: [fichier]
    doc: "Le fichier est dans l'index (staging)."
    moteurs: [git]
  commits-au-moins:
    arguments: [nombre]
    doc: "L'historique de la branche courante contient au moins ce nombre de commits."
    moteurs: [git]
  commits-exactement:
    arguments: [nombre]
    doc: "L'historique de la branche courante contient exactement ce nombre de commits."
    moteurs: [git]
  fichier-dans-head:
    arguments: [fichier]
    doc: "Le fichier est dans le dernier commit."
    moteurs: [git]
  fichier-propre:
    arguments: [fichier]
    doc: "Le fichier du dossier de travail est identique à celui du dernier commit."
    moteurs: [git]
  sur-branche:
    arguments: [branche]
    doc: "La branche courante est celle-ci."
    moteurs: [git]
  branche-existe:
    arguments: [branche]
    doc: "La branche existe."
    moteurs: [git]
  branche-absente:
    arguments: [branche]
    doc: "La branche n'existe pas (ou plus)."
    moteurs: [git]
  branche-en-avance:
    arguments: [branche, base]
    doc: "La branche a des commits que la base n'a pas."
    moteurs: [git]
  branche-egale:
    arguments: [branche, autre]
    doc: "Les deux branches pointent sur le même commit."
    moteurs: [git]
  fichier-dans-branche:
    arguments: [branche, fichier]
    optionnels: [regex]
    doc: "Le dernier commit de la branche contient le fichier (dont le contenu correspond à `regex` si précisé)."
    moteurs: [git]
  fusionne:
    arguments: [source, cible]
    doc: "Tous les commits de `source` sont dans `cible`."
    moteurs: [git]
  conflit-en-cours:
    doc: "Une fusion est en conflit (fichiers non fusionnés)."
    moteurs: [git]
  aucun-conflit:
    doc: "Plus aucun fichier en conflit."
    moteurs: [git]
  fusion-en-cours:
    doc: "Une fusion est commencée mais pas encore validée."
    moteurs: [git]
  fichier-sans-marqueurs:
    arguments: [fichier]
    doc: "Le fichier ne contient plus de marqueurs de conflit (`<<<<<<<`, `=======`, `>>>>>>>`)."
    moteurs: [git]
  commit-de-fusion:
    doc: "Le dernier commit est un commit de fusion terminé (deux parents)."
    moteurs: [git]
  remote-defini:
    arguments: [nom]
    doc: "Le dépôt distant est déclaré (`git remote add`)."
    moteurs: [git]
  amont-defini:
    arguments: [branche, amont]
    doc: "La branche suit cette branche distante (ex. `origin/main`)."
    moteurs: [git]
  serveur-a-la-pointe:
    arguments: [branche]
    doc: "La branche du serveur distant est au même commit que la branche locale."
    moteurs: [git]
  en-retard-sur-origin:
    arguments: [branche]
    doc: "Le serveur est connu (fetch) et a des commits que la branche locale n'a pas."
    moteurs: [git]
  dernier-auteur:
    arguments: [branche, auteur]
    doc: "Le dernier commit de la branche a été écrit par cette personne."
    moteurs: [git]

  # ── Docker ────────────────────────────────────────────────────────────────
  image-presente:
    arguments: [image]
    doc: "L'image (`nom` ou `nom:tag`) existe en local."
    moteurs: [docker]
  conteneur-existe:
    arguments: [nom]
    doc: "Le conteneur existe (quel que soit son état)."
    moteurs: [docker]
  conteneur-actif:
    arguments: [nom]
    doc: "Le conteneur est en cours d'exécution."
    moteurs: [docker]
  conteneur-arrete:
    arguments: [nom]
    doc: "Le conteneur est arrêté."
    moteurs: [docker]
  conteneur-absent:
    arguments: [nom]
    doc: "Le conteneur n'existe pas (ou plus)."
    moteurs: [docker]
  conteneur-image:
    arguments: [image]
    doc: "Au moins un conteneur a été créé à partir de cette image."
    moteurs: [docker]
  aucun-conteneur-image:
    arguments: [image]
    doc: "Aucun conteneur ne vient de cette image."
    moteurs: [docker]
  conteneur-sorti-code:
    arguments: [nom, code]
    doc: "Le conteneur s'est arrêté avec ce code de sortie."
    moteurs: [docker]
  conteneur-port:
    arguments: [nom, ports]
    doc: "Le conteneur publie ces ports (`hote:conteneur`, ex. `8080:80`)."
    moteurs: [docker]
  conteneur-reseau:
    arguments: [nom, reseau]
    doc: "Le conteneur est rattaché à ce réseau."
    moteurs: [docker]
  conteneur-bind:
    arguments: [nom]
    doc: "Le conteneur monte un dossier de ta machine (bind mount)."
    moteurs: [docker]
  volume-existe:
    arguments: [nom]
    doc: "Le volume existe."
    moteurs: [docker]
  volume-absent:
    arguments: [nom]
    doc: "Le volume n'existe pas (ou plus)."
    moteurs: [docker]
  volume-contient:
    arguments: [volume, fichier]
    doc: "Le volume contient ce fichier."
    moteurs: [docker]
  reseau-existe:
    arguments: [nom]
    doc: "Le réseau existe."
    moteurs: [docker]
  compose-conteneurs:
    arguments: [nombre]
    doc: "Au moins ce nombre de conteneurs Compose existent (quel que soit leur état)."
    moteurs: [docker]
  compose-actifs:
    arguments: [nombre]
    doc: "Au moins ce nombre de conteneurs Compose sont en cours d'exécution."
    moteurs: [docker]
  compose-vide:
    doc: "Plus aucun conteneur Compose n'existe."
    moteurs: [docker]
  compose-variable:
    arguments: [service, variable]
    doc: "Le service du `compose.yml` définit cette variable d'environnement."
    moteurs: [docker]
  registry-connecte:
    arguments: [registry]
    doc: "Un `docker login` a été fait vers ce registry."
    moteurs: [docker]
  image-poussee:
    arguments: [image]
    doc: "L'image a été publiée avec `docker push`."
    moteurs: [docker]

  # ── Environnement réel (moteur `reel`) ───────────────────────────────────
  # Évaluées PAR LE SERVEUR dans le conteneur de l'apprenant·e (formation/environments/verifications.py), jamais
  # par le navigateur : static/js/checks.js les déclare dans `ServerChecks`. Commandes exécutées en non-root, avec
  # un délai maximal, dans le dossier de travail (`workspaceFolder`). Les regex suivent la syntaxe Python.
  commande-reussit:
    arguments: [commande]
    doc: "La commande (lancée par `sh -c` dans l'environnement) se termine avec le code 0."
    moteurs: [reel]
  commande-echoue:
    arguments: [commande]
    doc: "La commande (lancée par `sh -c` dans l'environnement) se termine avec un code différent de 0."
    moteurs: [reel]
  sortie-contient:
    arguments: [commande, regex]
    doc: "La sortie standard de la commande (64 Kio au plus) correspond à l'expression régulière."
    moteurs: [reel]
  fichier-existe-dans-env:
    arguments: [chemin]
    doc: "Le fichier ou dossier existe dans l'environnement (chemin relatif au dossier de travail)."
    moteurs: [reel]
  fichier-absent-dans-env:
    arguments: [chemin]
    doc: "Le fichier ou dossier n'existe pas (ou plus) dans l'environnement."
    moteurs: [reel]
  fichier-contient-dans-env:
    arguments: [chemin, regex]
    doc: "Le contenu du fichier (64 premiers Kio) correspond à l'expression régulière."
    moteurs: [reel]

# Effets déclenchés quand une étape est validée (`effet:`).
effets:
  serveur-commit:
    doc: |
      Un·e coéquipier·ère pousse un commit sur le serveur distant simulé. Arguments (dictionnaire) :
      `branche`, `message`, `fichiers` (dictionnaire fichier → contenu), `auteur` (facultatif).
    moteurs: [git]
  serveur-avance:
    doc: |
      Simule l'acceptation d'une merge request : la branche `branche` du serveur avance (fast-forward)
      jusqu'au commit de la branche `vers`.
    moteurs: [git]
