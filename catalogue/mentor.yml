# Manifest of the built-in catalogue as a course package (format: doc/course-packages.md).
# The course list must stay identical to catalogue.yml until that file is removed; a test checks it.
format: 1
name: mentor-courses
version: 1.0.0
title: "Mentor : parcours de l'équipe"
summary: "Les 19 parcours repris de la v1 : Git, Docker, Python, web, bases de données, infrastructure."
# The licence of this repository (LICENSE). Whether course content gets a licence of its own is an open decision.
license: AGPL-3.0-or-later
courses:
  - git-basics
  - docker-hello
  - docker-advanced
  - python
  - django
  - oidc-keycloak
  - ci-gitlab
  - linux-shell
  - sql-postgresql
  - web-javascript
  - typescript
  - react-nextjs
  - angular
  - django-rest
  - maintenance-legacy
  - kubernetes-helm
  - terraform
  - sauvegardes-s3
  - go
# docker-hello and docker-advanced run a Docker daemon in their environment.
features:
  - docker
