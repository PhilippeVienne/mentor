<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
  <title id="t">Un code, deux workspaces</title>
  <desc id="d">Un même code Terraform alimente deux workspaces, production et un autre, chacun avec son propre état.</desc>
  <rect x="1" y="1" width="718" height="258" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle">
    <rect x="30" y="95" width="190" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="125" y="125">Code Terraform</text><text x="125" y="148" font-size="14" fill="#94a3b8">un seul jeu de .tf</text>
    <g stroke="#6366F1" stroke-width="2" fill="none"><path d="M220 120H320V60H400M220 140H320V200H400"/></g>
    <rect x="400" y="30" width="290" height="60" rx="12" fill="#1e293b" stroke="#7B42BC" stroke-width="2"/>
    <text x="545" y="58">workspace production</text><text x="545" y="78" font-size="14" fill="#94a3b8">état A, objets de production</text>
    <rect x="400" y="170" width="290" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="545" y="198">autre workspace</text><text x="545" y="218" font-size="14" fill="#94a3b8">état B, à confirmer avec l'équipe Infra</text>
  </g>
</svg>
