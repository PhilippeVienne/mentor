# Checks usable in the steps of a lab (`checks:`).
#
# A step is validated once ALL its checks hold. They are evaluated BY THE SERVER inside the learner's
# environment, never by the browser: each runs as the learner (never root), with a time limit, in the working
# folder (`workspaceFolder`). Commands come from the catalogue, never from the learner. Regular expressions are
# searched in the text, `^` and `$` matching at each line.
#
# A check sees the STATE of the environment, not what was typed: for a step that only looks at something, ask
# the learner to keep the output in a file and check the file. A check must change nothing and must not hold
# before the step is done.

checks:
  command-succeeds:
    arguments: [command]
    doc: "The command (run by `sh -c` in the environment) ends with exit code 0."
  command-fails:
    arguments: [command]
    doc: "The command (run by `sh -c` in the environment) ends with a non-zero exit code."
  output-contains:
    arguments: [command, regex]
    doc: "The standard output of the command (64 KiB at most) matches the regular expression."
  env-file-exists:
    arguments: [path]
    doc: "The file or folder exists in the environment (path relative to the working folder)."
  env-file-absent:
    arguments: [path]
    doc: "The file or folder does not exist (any more) in the environment."
  env-file-contains:
    arguments: [path, regex]
    doc: "The content of the file (first 64 KiB) matches the regular expression."
