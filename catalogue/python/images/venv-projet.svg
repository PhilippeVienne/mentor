<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">Environnements virtuels</title><desc id="d">Sans environnement virtuel, deux projets partagent le même Python du système et ne peuvent pas avoir des versions différentes de requests. Avec un dossier .venv par projet, chacun a son propre Python et ses propres paquets, décrits dans requirements.txt.</desc><defs><marker id="a3776AB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3776AB"/></marker><marker id="aFFD43B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFD43B"/></marker><marker id="aE32618" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="798" height="318" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="400" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">Un environnement virtuel par projet</text><rect x="30" y="62" width="240" height="238" rx="10" fill="#111b30" stroke="#6366F1" stroke-width="1.5"/><text x="150" y="88" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#6366F1" text-anchor="middle">Sans venv</text><rect x="50" y="104" width="200" height="60" rx="8" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="150" y="130" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Python du système</text><text x="150" y="150" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">requests 5.0 (un seul !)</text><text x="150" y="196" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#FFD43B" text-anchor="middle">projet A veut requests 4</text><text x="150" y="218" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#FFD43B" text-anchor="middle">projet B veut requests 5</text><text x="150" y="258" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6366F1" text-anchor="middle">→ l'un des deux casse</text><rect x="300" y="62" width="230" height="238" rx="10" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="415" y="88" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#3776AB" text-anchor="middle">projet-A/</text><rect x="320" y="104" width="190" height="92" rx="8" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="415" y="128" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">.venv/</text><text x="415" y="152" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">python + pip</text><text x="415" y="176" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#FFD43B" text-anchor="middle">requests 4.0</text><text x="415" y="224" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">requirements.txt</text><text x="415" y="246" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">.gitignore → .venv/</text><text x="415" y="276" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">✓ isolé</text><rect x="550" y="62" width="230" height="238" rx="10" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="665" y="88" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#22c55e" text-anchor="middle">projet-B/</text><rect x="570" y="104" width="190" height="92" rx="8" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="665" y="128" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">.venv/</text><text x="665" y="152" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">python + pip</text><text x="665" y="176" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#FFD43B" text-anchor="middle">requests 5.0</text><text x="665" y="224" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">requirements.txt</text><text x="665" y="246" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">.gitignore → .venv/</text><text x="665" y="276" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">✓ isolé</text></svg>