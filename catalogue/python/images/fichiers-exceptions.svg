<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">Lire un fichier avec with et gérer une erreur avec try/except</title><desc id="d">À gauche, un bloc with open qui ouvre le fichier, permet de lire ou écrire, puis le referme automatiquement. À droite, un bloc try : si int(ligne) réussit le programme continue, si une ValueError est levée le bloc except la rattrape.</desc><defs><marker id="a3776AB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3776AB"/></marker><marker id="aFFD43B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFD43B"/></marker><marker id="aE32618" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="798" height="318" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="400" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">Les fichiers et les erreurs</text><rect x="30" y="62" width="350" height="238" rx="10" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="48" y="88" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#3776AB" text-anchor="start">with open(...) as fichier:</text><rect x="54" y="104" width="300" height="44" rx="8" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="204" y="132" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">1  ouvre le fichier</text><line x1="204" y1="150" x2="204" y2="164" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a94a3b8)"/><rect x="54" y="164" width="300" height="44" rx="8" fill="#111b30" stroke="#FFD43B" stroke-width="1.5"/><text x="204" y="192" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">2  lis / écris dans le bloc</text><line x1="204" y1="210" x2="204" y2="224" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a94a3b8)"/><rect x="54" y="224" width="300" height="44" rx="8" fill="#111b30" stroke="#6366F1" stroke-width="1.5"/><text x="204" y="252" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">3  fermeture automatique</text><text x="48" y="290" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">mode "r" lit · "w" écrase · "a" ajoute</text><rect x="410" y="62" width="360" height="238" rx="10" fill="#111b30" stroke="#FFD43B" stroke-width="1.5"/><text x="428" y="88" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#FFD43B" text-anchor="start">try / except</text><rect x="430" y="106" width="320" height="40" rx="8" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="590" y="132" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">try:  n = int(ligne)</text><line x1="510" y1="148" x2="510" y2="186" stroke="#22c55e" stroke-width="2.5" marker-end="url(#a22c55e)"/><text x="560" y="172" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#22c55e" text-anchor="middle">ça marche</text><line x1="670" y1="148" x2="670" y2="186" stroke="#6366F1" stroke-width="2.5" marker-end="url(#aE32618)"/><text x="716" y="172" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#6366F1" text-anchor="middle">ValueError</text><rect x="430" y="190" width="150" height="44" rx="8" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="505" y="217" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">suite normale</text><rect x="600" y="190" width="150" height="44" rx="8" fill="#111b30" stroke="#6366F1" stroke-width="1.5"/><text x="675" y="217" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">except ValueError:</text><text x="590" y="266" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">else si pas d'erreur · finally toujours</text><text x="590" y="286" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">attrape l'erreur prévue, pas toutes</text></svg>