<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">Du fichier Python au résultat dans le terminal</title><desc id="d">Un fichier salut.py avec deux lignes de code est lancé par la commande python3 salut.py et affiche Bonjour Mentor ! dans le terminal. En dessous, les quatre types de base : str, int, float et bool.</desc><defs><marker id="a3776AB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3776AB"/></marker><marker id="aFFD43B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFD43B"/></marker><marker id="aE32618" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="798" height="318" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="400" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">Du fichier .py au résultat</text><rect x="40" y="70" width="262" height="150" rx="10" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="60" y="96" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#3776AB" text-anchor="start">salut.py</text><text x="58" y="128" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start">prenom = "Mentor"</text><text x="58" y="154" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start">print(f"Bonjour {prenom} !")</text><line x1="310" y1="150" x2="466" y2="150" stroke="#FFD43B" stroke-width="2.5" marker-end="url(#aFFD43B)"/><text x="388" y="132" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#FFD43B" text-anchor="middle">python3 salut.py</text><rect x="474" y="70" width="286" height="150" rx="10" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="494" y="96" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="start">Terminal</text><text x="494" y="130" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">$ python3 salut.py</text><text x="494" y="158" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start">Bonjour Mentor !</text><text x="40" y="256" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="start">Les quatre types de base</text><rect x="40" y="270" width="138" height="26" rx="13" fill="#3776AB" fill-opacity=".18" stroke="#3776AB"/><text x="109.0" y="288" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">str  "Mentor"</text><rect x="190" y="270" width="138" height="26" rx="13" fill="#FFD43B" fill-opacity=".18" stroke="#FFD43B"/><text x="259.0" y="288" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">int  42</text><rect x="340" y="270" width="138" height="26" rx="13" fill="#6366F1" fill-opacity=".18" stroke="#6366F1"/><text x="409.0" y="288" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">float  3.14</text><rect x="490" y="270" width="138" height="26" rx="13" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/><text x="559.0" y="288" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">bool  True</text></svg>