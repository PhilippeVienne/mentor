<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">Listes, dictionnaires et compréhensions</title><desc id="d">Une liste de quatre éléments indexés de 0 à 3, un dictionnaire qui associe les clés nom, age et asso à des valeurs, et une compréhension de liste qui transforme les nombres de 0 à 3 sauf 2 en leurs carrés.</desc><defs><marker id="a3776AB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3776AB"/></marker><marker id="aFFD43B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFD43B"/></marker><marker id="aE32618" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="798" height="318" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="400" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">Trois façons d'organiser des données</text><text x="40" y="78" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#3776AB" text-anchor="start">Liste : ordonnée, indexée dès 0</text><rect x="40" y="92" width="64" height="44" rx="6" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="72" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Mentor</text><text x="72" y="156" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">0</text><rect x="110" y="92" width="64" height="44" rx="6" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="142" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">BdE</text><text x="142" y="156" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">1</text><rect x="180" y="92" width="64" height="44" rx="6" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="212" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Gala</text><text x="212" y="156" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">2</text><rect x="250" y="92" width="64" height="44" rx="6" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="282" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Raid</text><text x="282" y="156" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">3</text><text x="40" y="188" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">assos[0] → "Mentor"  ·  assos[-1] → "Raid"</text><text x="440" y="78" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFD43B" text-anchor="start">Dictionnaire : clé → valeur</text><rect x="440" y="92" width="110" height="32" rx="6" fill="#111b30" stroke="#FFD43B" stroke-width="1.5"/><text x="495" y="113" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">"nom"</text><line x1="554" y1="108" x2="590" y2="108" stroke="#FFD43B" stroke-width="2.5" marker-end="url(#aFFD43B)"/><rect x="594" y="92" width="110" height="32" rx="6" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="649" y="113" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">"Ada"</text><rect x="440" y="130" width="110" height="32" rx="6" fill="#111b30" stroke="#FFD43B" stroke-width="1.5"/><text x="495" y="151" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">"age"</text><line x1="554" y1="146" x2="590" y2="146" stroke="#FFD43B" stroke-width="2.5" marker-end="url(#aFFD43B)"/><rect x="594" y="130" width="110" height="32" rx="6" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="649" y="151" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">36</text><rect x="440" y="168" width="110" height="32" rx="6" fill="#111b30" stroke="#FFD43B" stroke-width="1.5"/><text x="495" y="189" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">"asso"</text><line x1="554" y1="184" x2="590" y2="184" stroke="#FFD43B" stroke-width="2.5" marker-end="url(#aFFD43B)"/><rect x="594" y="168" width="110" height="32" rx="6" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="649" y="189" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">"Mentor"</text><rect x="40" y="214" width="720" height="88" rx="10" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="60" y="240" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="start">Compréhension : une boucle en une expression</text><text x="60" y="268" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="start">[n * n for n in range(4) if n != 2]</text><line x1="400" y1="262" x2="450" y2="262" stroke="#22c55e" stroke-width="2.5" marker-end="url(#a22c55e)"/><text x="462" y="268" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#FFD43B" text-anchor="start">[0, 1, 9]</text><text x="60" y="290" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">pour chaque n de 0 à 3, sauf 2, garde n au carré</text></svg>