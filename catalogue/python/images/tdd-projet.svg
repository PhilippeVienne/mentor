<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">Le cycle du TDD et l'architecture du mini-projet</title><desc id="d">À gauche, le cycle du développement piloté par les tests : rouge, vert, amélioration. À droite, l'architecture du mini-projet todo : cli.py utilise taches.py pour la logique et stockage.py pour le fichier JSON.</desc><defs><marker id="a3776AB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3776AB"/></marker><marker id="aFFD43B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFD43B"/></marker><marker id="aE32618" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="798" height="318" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="400" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">TDD et architecture du mini-projet</text><text x="30" y="76" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="start">Le cycle TDD</text><rect x="60" y="96" width="220" height="56" rx="12" fill="#111b30" stroke="#6366F1" stroke-width="1.5"/><text x="170" y="120" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">1  Rouge</text><text x="170" y="139" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">un test échoue</text><rect x="60" y="166" width="220" height="56" rx="12" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="170" y="190" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">2  Vert</text><text x="170" y="209" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">le minimum qui passe</text><rect x="60" y="236" width="220" height="56" rx="12" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="170" y="260" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">3  Améliorer</text><text x="170" y="279" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">relire, simplifier</text><line x1="170" y1="154" x2="170" y2="164" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a94a3b8)"/><line x1="170" y1="224" x2="170" y2="234" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a94a3b8)"/><path d="M284 264 H330 V124 H286" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a94a3b8)"/><text x="338" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">on recommence</text><text x="30" y="304" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#FFD43B" text-anchor="start">pytest -q après chaque modification</text><text x="440" y="76" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="start">Trois modules</text><rect x="440" y="92" width="330" height="56" rx="10" fill="#111b30" stroke="#FFD43B" stroke-width="1.5"/><text x="605" y="118" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">todo/cli.py</text><text x="605" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">argparse : lit la ligne de commande</text><rect x="440" y="176" width="150" height="56" rx="10" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="515" y="202" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">taches.py</text><text x="515" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">la logique</text><rect x="620" y="176" width="150" height="56" rx="10" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="695" y="202" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">stockage.py</text><text x="695" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">fichier JSON</text><line x1="540" y1="150" x2="515" y2="174" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a94a3b8)"/><line x1="670" y1="150" x2="695" y2="174" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a94a3b8)"/><text x="605" y="268" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">tests/ : un fichier de tests par module</text></svg>