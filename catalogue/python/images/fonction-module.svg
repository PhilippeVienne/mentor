<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">Un module importé par un programme</title><desc id="d">Le module mathutils.py définit les fonctions carre et est_pair. Le programme app.py les importe. Quand on lance app.py, la variable __name__ vaut __main__ et main() s'exécute ; quand on l'importe, __name__ vaut app et rien ne s'exécute.</desc><defs><marker id="a3776AB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3776AB"/></marker><marker id="aFFD43B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFD43B"/></marker><marker id="aE32618" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="798" height="318" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="400" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">Un module, un programme, et __name__</text><rect x="30" y="66" width="330" height="150" rx="10" fill="#111b30" stroke="#3776AB" stroke-width="1.5"/><text x="48" y="92" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#3776AB" text-anchor="start">mathutils.py  (module)</text><text x="48" y="122" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start">def carre(n):</text><text x="48" y="144" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start">    """Retourne n au carré."""</text><text x="48" y="166" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start">    return n * n</text><text x="48" y="188" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start"></text><text x="48" y="210" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start">def est_pair(n): ...</text><line x1="366" y1="140" x2="440" y2="140" stroke="#FFD43B" stroke-width="2.5" marker-end="url(#aFFD43B)"/><text x="403" y="124" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#FFD43B" text-anchor="middle">import</text><rect x="446" y="66" width="324" height="150" rx="10" fill="#111b30" stroke="#22c55e" stroke-width="1.5"/><text x="464" y="92" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#22c55e" text-anchor="start">app.py  (programme)</text><text x="464" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">from mathutils import carre</text><text x="464" y="140" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">def main():</text><text x="464" y="160" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">    print(carre(12))</text><text x="464" y="180" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">if __name__ == "__main__":</text><text x="464" y="200" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">    main()</text><rect x="30" y="238" width="360" height="62" rx="10" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="48" y="262" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#FFD43B" text-anchor="start">python3 app.py</text><text x="48" y="284" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">__name__ vaut "__main__" → main() s'exécute</text><rect x="410" y="238" width="360" height="62" rx="10" fill="#111b30" stroke="#1e293b" stroke-width="1.5"/><text x="428" y="262" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#FFD43B" text-anchor="start">import app</text><text x="428" y="284" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">__name__ vaut "app" → rien ne s'exécute</text></svg>