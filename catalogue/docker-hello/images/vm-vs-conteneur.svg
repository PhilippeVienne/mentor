<rect x="204" y="178" width="156" height="40" rx="8" fill="#111c33" stroke="#f59e0b" stroke-width="2"/><text x="282" y="203" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">OS invité complet</text>
<rect x="204" y="222" width="156" height="42" rx="8" fill="#111c33" stroke="#f59e0b" stroke-width="2"/><text x="282" y="248" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">App B</text>
<text x="200" y="292" font-size="12" fill="#f59e0b" font-weight="400" text-anchor="middle">≈ plusieurs Go, démarrage en minutes</text>
