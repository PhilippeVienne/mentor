<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Machine virtuelle contre conteneur</title><desc id="d">Une VM embarque un système d&#x27;exploitation invité complet au-dessus d&#x27;un hyperviseur ; les conteneurs partagent le noyau de l&#x27;hôte et n&#x27;embarquent que leurs bibliothèques et leur code.</desc>
<defs>
