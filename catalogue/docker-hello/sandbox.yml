# Scénarios proposés dans le bac à sable Docker (voir catalogue/README.md).
scenarios:
  vide:
    title: Aucun conteneur
    hint: "Commence par : docker run hello-world"
  web:
    title: Un nginx déjà lancé
    commands:
      - docker run -d --name web -p 8080:80 nginx
    hint: "Essaie : curl localhost:8080 puis docker logs web"
  site:
    title: Un site à servir (index.html)
    files:
      index.html: |
        <h1>Mon site Mentor</h1>
    hint: "Essaie : docker run -d -p 8081:80 -v $(pwd):/usr/share/nginx/html nginx"
  compose:
    title: Un projet Compose (web + base)
    files:
      compose.yml: |
        services:
          web:
            image: nginx
            ports:
              - "8080:80"
          db:
            image: postgres:16-alpine
            environment:
              POSTGRES_PASSWORD: secret
    hint: "Essaie : docker compose up -d puis docker compose ps"
