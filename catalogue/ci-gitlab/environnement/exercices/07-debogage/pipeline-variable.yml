stages:
  - build

build:
  stage: build
  image: docker:27
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAG:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAG:$CI_COMMIT_REF_SLUG"
