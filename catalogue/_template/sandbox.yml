# Scénarios proposés dans le bac à sable du moteur du parcours.
# Chaque scénario : titre (affiché dans la liste), fichiers (fichier: contenu), commandes (jouées au démarrage),
# serveur (git uniquement : dépôts distants simulés avec leurs commits), indice (suggestion affichée à l'apprenant·e).
scenarios:
  vide:
    title: Dossier vide
  projet:
    title: Projet avec quelques commits
    files:
      README.md: |
        # Mon projet
    commands:
      - git init
      - git add . && git commit -m "Initialise le projet"
    hint: "Essaie : git log --oneline"
  clone:
    title: Cloner un dépôt GitLab
    server:
      - url: git@gitlab.example.org:equipe/exemple.git
        commits:
          - branch: main
            message: Initialise l'exemple
            files:
              README.md: |
                # Exemple
            author: Camille
    hint: "Essaie : git clone git@gitlab.example.org:equipe/exemple.git"
