  <rect x="30" y="70" width="190" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="125" y="116" text-anchor="middle" font-size="16" fill="#e2e8f0">1. Restaurer (test)</text>
  <rect x="265" y="70" width="190" height="80" rx="12" fill="#1e293b" stroke="#6366F1" stroke-width="2"/>
  <text x="360" y="116" text-anchor="middle" font-size="16" fill="#e2e8f0">2. Vérifier</text>
  <rect x="500" y="70" width="190" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="595" y="116" text-anchor="middle" font-size="16" fill="#e2e8f0">3. Consigner la durée</text>
