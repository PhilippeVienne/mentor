<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">Sauvegarde d'un volume par CronJob</title>
  <desc id="d">Un CronJob lance un conteneur backups3 qui lit un volume en lecture seule, crée une archive compressée, puis l'envoie dans un bucket S3.</desc>
  <rect x="1" y="1" width="718" height="238" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <rect x="30" y="85" width="150" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="105" y="125" text-anchor="middle" font-size="16" fill="#e2e8f0">Volume (PVC)</text>
  <rect x="285" y="75" width="170" height="90" rx="12" fill="#1e293b" stroke="#6366F1" stroke-width="2"/>
  <text x="370" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">CronJob</text>
  <text x="370" y="140" text-anchor="middle" font-size="14" fill="#94a3b8">backup.py -c</text>
  <rect x="560" y="85" width="130" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="625" y="125" text-anchor="middle" font-size="16" fill="#e2e8f0">Bucket S3</text>
  <path d="M180 120H283M455 120H558" stroke="#6366F1" stroke-width="3"/>
  <text x="232" y="105" text-anchor="middle" font-size="13" fill="#94a3b8">lecture seule</text>
  <text x="507" y="105" text-anchor="middle" font-size="13" fill="#94a3b8">.tgz</text>
</svg>
