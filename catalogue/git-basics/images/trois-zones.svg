<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" width="800" height="316" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif"><title id="t">Les trois zones de Git</title><desc id="d">Dossier de travail, index et dépôt, reliés par git add puis git commit ; git restore fait le chemin inverse.</desc><defs><marker id="a-text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs><rect x="1" y="1" width="798" height="314" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><rect x="14" y="40" width="198" height="190" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="113" y="74" font-size="16" fill="#f59e0b" font-weight="700" text-anchor="middle">Dossier de travail</text><text x="113" y="94" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle">tes fichiers, tels que tu les édites</text><rect x="301" y="40" width="198" height="190" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="400" y="74" font-size="16" fill="#38bdf8" font-weight="700" text-anchor="middle">Index (staging)</text><text x="400" y="94" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle">ce qui ira dans le prochain commit</text><rect x="588" y="40" width="198" height="190" rx="16" fill="#0f172a" stroke="#22c55e" stroke-width="2"/><text x="687" y="74" font-size="16" fill="#22c55e" font-weight="700" text-anchor="middle">Dépôt (.git)</text><text x="687" y="94" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle">l&#x27;historique des commits</text><rect x="26" y="112" width="174" height="30" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/><circle cx="42" cy="127" r="5" fill="#f59e0b"/><text x="54" y="132" font-size="13" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">index.html</text><text x="190" y="132" font-size="11" fill="#f59e0b" font-weight="700" text-anchor="end">modifié</text><rect x="26" y="150" width="174" height="30" rx="8" fill="#0f172a" stroke="#6366F1" stroke-width="1.5"/><circle cx="42" cy="165" r="5" fill="#6366F1"/><text x="54" y="170" font-size="13" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">style.css</text><text x="190" y="170" font-size="11" fill="#6366F1" font-weight="700" text-anchor="end">nouveau</text><rect x="26" y="188" width="174" height="30" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><circle cx="42" cy="203" r="5" fill="#94a3b8"/><text x="54" y="208" font-size="13" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">README.md</text><rect x="313" y="112" width="174" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><circle cx="329" cy="127" r="5" fill="#38bdf8"/><text x="341" y="132" font-size="13" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">index.html</text><text x="477" y="132" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="end">prêt</text><circle cx="616" cy="140" r="11" fill="#22c55e" stroke="#0b1220" stroke-width="4"/><circle cx="650" cy="140" r="11" fill="#22c55e" stroke="#0b1220" stroke-width="4"/><circle cx="684" cy="140" r="11" fill="#22c55e" stroke="#0b1220" stroke-width="4"/><circle cx="718" cy="140" r="11" fill="#22c55e" stroke="#0b1220" stroke-width="4"/><path d="M627 140 H639 M661 140 H673 M695 140 H707" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="694.1" y="174" width="47.8" height="22" rx="11" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="718.0" y="190" font-size="12" fill="#0b1220" font-weight="700" text-anchor="middle">HEAD</text><text x="700" y="212" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle">dernier commit</text><line x1="216" y1="130" x2="296" y2="130" stroke="#6366F1" stroke-width="2.5" marker-end="url(#a-red)"/><rect x="221.0" y="98" width="70.1" height="22" rx="11" fill="#6366F1" stroke="#6366F1" stroke-width="1.5"/><text x="256.0" y="114" font-size="12" fill="#0b1220" font-weight="700" text-anchor="middle">git add</text><line x1="503" y1="130" x2="583" y2="130" stroke="#22c55e" stroke-width="2.5" marker-end="url(#a-green)"/><rect x="496.8" y="98" width="92.4" height="22" rx="11" fill="#22c55e" stroke="#22c55e" stroke-width="1.5"/><text x="543.0" y="114" font-size="12" fill="#0b1220" font-weight="700" text-anchor="middle">git commit</text><line x1="296" y1="176" x2="216" y2="176" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-mute)"/><text x="256" y="196" font-size="10.5" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git restore</text><line x1="583" y1="176" x2="503" y2="176" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-mute)"/><text x="543" y="194" font-size="10.5" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">restore</text><text x="543" y="207" font-size="10.5" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--staged</text><text x="400" y="262" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">Tu modifies → tu choisis (add) → tu enregistres (commit)</text><text x="400" y="290" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">Seul ce qui est dans l&#x27;index part dans le commit.</text></svg>