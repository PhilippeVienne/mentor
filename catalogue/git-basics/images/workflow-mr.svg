<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif"><title id="t">Flux feature branch et merge request</title><desc id="d">Six étapes : créer une branche, commiter, publier, ouvrir une merge request, fusionner, nettoyer.</desc><defs><marker id="a-text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs><rect x="1" y="1" width="798" height="318" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="400" y="38" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle">Le cycle d&#x27;une fonctionnalité</text><rect x="24" y="70" width="112" height="130" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><circle cx="80" cy="96" r="14" fill="#38bdf8"/><text x="80" y="101" font-size="14" fill="#0b1220" font-weight="700" text-anchor="middle">1</text><text x="80" y="132" font-size="13.5" fill="#38bdf8" font-weight="700" text-anchor="middle">Branche</text><text x="80" y="156" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git switch -c</text><text x="80" y="172" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ma-fonction</text><line x1="138" y1="135" x2="150" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-mute)"/><rect x="152" y="70" width="112" height="130" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><circle cx="208" cy="96" r="14" fill="#38bdf8"/><text x="208" y="101" font-size="14" fill="#0b1220" font-weight="700" text-anchor="middle">2</text><text x="208" y="132" font-size="13.5" fill="#38bdf8" font-weight="700" text-anchor="middle">Commits</text><text x="208" y="156" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git commit</text><text x="208" y="172" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">(souvent !)</text><line x1="266" y1="135" x2="278" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-mute)"/><rect x="280" y="70" width="112" height="130" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><circle cx="336" cy="96" r="14" fill="#f59e0b"/><text x="336" y="101" font-size="14" fill="#0b1220" font-weight="700" text-anchor="middle">3</text><text x="336" y="132" font-size="13.5" fill="#f59e0b" font-weight="700" text-anchor="middle">Publier</text><text x="336" y="156" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git push -u</text><text x="336" y="172" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">origin &lt;branche&gt;</text><line x1="394" y1="135" x2="406" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-mute)"/><rect x="408" y="70" width="112" height="130" rx="14" fill="#0f172a" stroke="#6366F1" stroke-width="2"/><circle cx="464" cy="96" r="14" fill="#6366F1"/><text x="464" y="101" font-size="14" fill="#0b1220" font-weight="700" text-anchor="middle">4</text><text x="464" y="132" font-size="12.5" fill="#6366F1" font-weight="700" text-anchor="middle">Merge Request</text><text x="464" y="156" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">relecture</text><text x="464" y="172" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ CI GitLab</text><line x1="522" y1="135" x2="534" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-mute)"/><rect x="536" y="70" width="112" height="130" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/><circle cx="592" cy="96" r="14" fill="#22c55e"/><text x="592" y="101" font-size="14" fill="#0b1220" font-weight="700" text-anchor="middle">5</text><text x="592" y="132" font-size="13.5" fill="#22c55e" font-weight="700" text-anchor="middle">Fusion</text><text x="592" y="156" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">approuvée →</text><text x="592" y="172" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">main</text><line x1="650" y1="135" x2="662" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-mute)"/><rect x="664" y="70" width="112" height="130" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/><circle cx="720" cy="96" r="14" fill="#22c55e"/><text x="720" y="101" font-size="14" fill="#0b1220" font-weight="700" text-anchor="middle">6</text><text x="720" y="132" font-size="13.5" fill="#22c55e" font-weight="700" text-anchor="middle">Nettoyage</text><text x="720" y="156" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git pull +</text><text x="720" y="172" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">branch -d</text><rect x="24" y="226" width="752" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/><text x="44" y="252" font-size="13" fill="#38bdf8" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">main</text><path d="M92 248 H756" fill="none" stroke="#38bdf8" stroke-width="3"/><circle cx="150" cy="248" r="8" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/><circle cx="330" cy="248" r="8" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/><circle cx="560" cy="248" r="8" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/><circle cx="700" cy="248" r="8" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/><path d="M330 248 C350 248 352 276 372 276 H500 C520 276 522 248 560 248" fill="none" stroke="#22c55e" stroke-width="3"/><circle cx="400" cy="276" r="7" fill="#22c55e" stroke="#0b1220" stroke-width="4"/><circle cx="470" cy="276" r="7" fill="#22c55e" stroke="#0b1220" stroke-width="4"/><text x="436" y="294" font-size="11" fill="#22c55e" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ma-fonction</text></svg>