<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" width="800" height="332" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif"><title id="t">Historique et annulations</title><desc id="d">Une chaîne de commits avec HEAD, HEAD~1 et HEAD~2, puis les commandes qui font revenir en arrière entre les trois zones.</desc><defs><marker id="a-text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs><rect x="1" y="1" width="798" height="330" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="2"/><text x="30" y="40" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Se repérer : HEAD et ses ancêtres</text><path d="M108 100 H492" fill="none" stroke="#94a3b8" stroke-width="3"/><circle cx="90" cy="100" r="15" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/><text x="90" y="133" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a1f9c0e</text><circle cx="230" cy="100" r="15" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/><text x="230" y="133" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5be2d71</text><circle cx="370" cy="100" r="15" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/><text x="370" y="133" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c93aa04</text><circle cx="510" cy="100" r="15" fill="#6366F1" stroke="#0b1220" stroke-width="4"/><text x="510" y="133" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WIP</text><rect x="486.1" y="50" width="47.8" height="22" rx="11" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/><text x="510.0" y="66" font-size="12" fill="#0b1220" font-weight="700" text-anchor="middle">HEAD</text><rect x="506.1" y="24" width="47.8" height="22" rx="11" fill="#22c55e" stroke="#22c55e" stroke-width="1.5"/><text x="530.0" y="40" font-size="12" fill="#0b1220" font-weight="700" text-anchor="middle">main</text><text x="230" y="152" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HEAD~2</text><text x="370" y="152" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HEAD~1</text><text x="510" y="152" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HEAD</text><text x="510" y="170" font-size="11.5" fill="#6366F1" font-weight="400" text-anchor="middle">« WIP » : oups, un secret dedans</text><rect x="590" y="60" width="180" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/><text x="680" y="88" font-size="12.5" fill="#f59e0b" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git log --oneline</text><text x="680" y="110" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">1 ligne = 1 commit</text><text x="680" y="130" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">le plus récent en haut</text><text x="30" y="196" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Annuler : quelle zone remonter ?</text><rect x="30" y="214" width="180" height="56" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="120" y="248" font-size="16" fill="#f59e0b" font-weight="700" text-anchor="middle">Travail</text><rect x="310" y="214" width="180" height="56" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="400" y="248" font-size="16" fill="#38bdf8" font-weight="700" text-anchor="middle">Index</text><rect x="590" y="214" width="180" height="56" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/><text x="680" y="248" font-size="16" fill="#22c55e" font-weight="700" text-anchor="middle">Dépôt</text><path d="M 308 242 H 214" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a-mute)"/><text x="261" y="232" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">restore</text><path d="M 588 242 H 494" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a-mute)"/><text x="541" y="232" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">restore --staged</text><path d="M 680 272 C 680 304 120 304 120 274" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="390" y="316" font-size="12" fill="#6366F1" font-weight="400" text-anchor="middle">reset HEAD~1 : le commit disparaît, les fichiers restent au travail</text></svg>