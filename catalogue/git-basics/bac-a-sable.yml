# Scénarios proposés dans le bac à sable Git.
scenarios:
  vide:
    titre: Dossier vide
    indice: "Commence par : git init"

  projet:
    titre: Projet avec quelques commits
    commandes:
      - git init
      - 'echo "# Mon projet" > README.md'
      - 'git add . && git commit -m "Initialise le projet"'
      - 'echo ''print("Bonjour")'' > main.py'
      - 'git add . && git commit -m "Ajoute le script"'
    indice: "Essaie : git log --oneline, git switch -c ma-branche…"

  clone:
    titre: Cloner un dépôt GitLab
    serveur:
      - url: git@gitlab.example.org:equipe/formation-git.git
        commits:
          - branche: main
            message: Initialise la formation
            fichiers:
              README.md: |
                # Formation Git de l'équipe
            auteur: Camille
          - branche: main
            message: Ajoute les exercices
            fichiers:
              exercices.md: |
                1. Fais un commit
                2. Crée une branche
            auteur: Camille
    indice: "Essaie : git clone git@gitlab.example.org:equipe/formation-git.git"

  conflit:
    titre: Un conflit prêt à résoudre
    commandes:
      - git init
      - 'echo "<h1>Bienvenue</h1>" > index.html'
      - 'echo "<p>Formation Git</p>" >> index.html'
      - 'git add . && git commit -m "Initialise la page"'
      - git switch -c titre-demo
      - 'echo "<h1>Bienvenue chez Mentor</h1>" > index.html'
      - 'echo "<p>Formation Git</p>" >> index.html'
      - 'git commit -am "Titre version Mentor"'
      - git switch main
      - "echo \"<h1>Bienvenue sur le campus</h1>\" > index.html"
      - 'echo "<p>Formation Git</p>" >> index.html'
      - 'git commit -am "Titre version Campus"'
    indice: "Essaie : git merge titre-demo"
