<text x="600.0" y="150" font-size="15" fill="#e2e8f0" font-weight="600" text-anchor="middle">/usr/share/nginx/html</text>
<text x="600.0" y="170" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">chemin dans le conteneur</text>
<rect x="440" y="232" width="320" height="60" rx="10" fill="#111c33" stroke="#22c55e" stroke-width="2"/>
<text x="600.0" y="256" font-size="15" fill="#e2e8f0" font-weight="600" text-anchor="middle">./site  (ton dossier)</text>
<text x="600.0" y="276" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">sur ta machine</text>
