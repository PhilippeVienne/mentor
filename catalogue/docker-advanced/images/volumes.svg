<text x="200.0" y="256" font-size="15" fill="#e2e8f0" font-weight="600" text-anchor="middle">Volume « donnees »</text>
<text x="200.0" y="276" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">géré par Docker</text>
<line x1="200" y1="184" x2="200" y2="230" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ag)" marker-start="url(#ag)"/>
<rect x="210.0" y="196" width="140" height="24" rx="12" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
<text x="280" y="212" font-size="11" fill="#22c55e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-v donnees:/data</text>
