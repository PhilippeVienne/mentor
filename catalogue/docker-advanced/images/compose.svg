<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Architecture Docker Compose</title><desc id="d">Le fichier compose.yml décrit deux services, web et db, un réseau projet_default créé automatiquement et un volume dbdata pour les données de la base.</desc>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2496ED"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect x="1" y="1" width="798" height="318" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
<text x="400" y="36" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="middle">Docker Compose : une description, toute l&#x27;application</text>
<rect x="30" y="70" width="200" height="220" rx="10" fill="#111c33" stroke="#94a3b8" stroke-width="2"/>
<text x="130" y="96" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">compose.yml</text>
<text x="44" y="122" font-size="11" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">services:</text>
<text x="44" y="140" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  web:</text>
<text x="44" y="158" font-size="11" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    image: nginx</text>
<text x="44" y="176" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    ports: [&quot;8080:80&quot;]</text>
<text x="44" y="194" font-size="11" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  db:</text>
<text x="44" y="212" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    image: postgres:16</text>
<text x="44" y="230" font-size="11" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    volumes: [dbdata:…]</text>
<text x="44" y="248" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">volumes:</text>
<text x="44" y="266" font-size="11" fill="#e2e8f0" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  dbdata:</text>
<line x1="232" y1="180" x2="330" y2="180" stroke="#2496ED" stroke-width="2.4" marker-end="url(#ab)"/>
<rect x="251.0" y="148" width="60" height="24" rx="12" fill="#0b1220" stroke="#2496ED" stroke-width="1.5"/>
<text x="281" y="164" font-size="12" fill="#2496ED" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">up -d</text>
<rect x="340" y="62" width="430" height="236" rx="10" fill="#111c33" stroke="#2496ED" stroke-width="2" stroke-dasharray="6 5"/>
<text x="360" y="86" font-size="12" fill="#2496ED" font-weight="700" text-anchor="start">projet_default (réseau créé par Compose)</text>
<rect x="370" y="110" width="150" height="70" rx="10" fill="#111c33" stroke="#22c55e" stroke-width="2"/>
<text x="445.0" y="140" font-size="15" fill="#e2e8f0" font-weight="600" text-anchor="middle">web</text>
<text x="445.0" y="160" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">projet-web-1 · :8080</text>
<rect x="590" y="110" width="150" height="70" rx="10" fill="#111c33" stroke="#22c55e" stroke-width="2"/>
<text x="665.0" y="140" font-size="15" fill="#e2e8f0" font-weight="600" text-anchor="middle">db</text>
<text x="665.0" y="160" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">projet-db-1</text>
<line x1="520" y1="145" x2="588" y2="145" stroke="#2496ED" stroke-width="2.4" marker-end="url(#ab)" marker-start="url(#ab)"/>
<rect x="590" y="214" width="150" height="56" rx="10" fill="#111c33" stroke="#f59e0b" stroke-width="2"/>
<text x="665.0" y="238" font-size="15" fill="#e2e8f0" font-weight="600" text-anchor="middle">volume dbdata</text>
<text x="665.0" y="258" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">survit à down</text>
<line x1="665" y1="182" x2="665" y2="212" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#am)"/>
<text x="445" y="214" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle">depends_on : db démarre d&#x27;abord</text>
<text x="445" y="232" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle">down  → supprime conteneurs + réseau</text>
<text x="445" y="250" font-size="11" fill="#f59e0b" font-weight="400" text-anchor="middle">down -v → supprime aussi les volumes</text>

</svg>
