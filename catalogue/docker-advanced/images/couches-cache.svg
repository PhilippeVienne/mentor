<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Couches et cache de build</title><desc id="d">Chaque instruction du Dockerfile produit une couche. Après modification du code, les couches 1 à 4 viennent du cache, les couches 5 et 6 sont reconstruites.</desc>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2496ED"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect x="1" y="1" width="798" height="328" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
<text x="400" y="36" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="middle">Les couches d&#x27;une image et le cache de build</text>
<text x="40" y="72" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start">Dockerfile</text>
<text x="470" y="72" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start">Couches de l&#x27;image</text>
<rect x="30" y="84" width="340" height="30" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/><text x="44" y="104" font-size="13" fill="#e2e8f0" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FROM python:3.13-slim</text>
<rect x="470" y="84" width="190" height="30" rx="6" fill="#111c33" stroke="#22c55e" stroke-width="2"/><text x="565" y="104" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">couche 1</text>
<line x1="372" y1="99" x2="468" y2="99" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ag)"/>
<rect x="667.0" y="87" width="96" height="24" rx="12" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
<text x="715" y="103" font-size="11" fill="#22c55e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CACHED</text>
<rect x="30" y="120" width="340" height="30" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/><text x="44" y="140" font-size="13" fill="#e2e8f0" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WORKDIR /app</text>
<rect x="470" y="120" width="190" height="30" rx="6" fill="#111c33" stroke="#22c55e" stroke-width="2"/><text x="565" y="140" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">couche 2</text>
<line x1="372" y1="135" x2="468" y2="135" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ag)"/>
<rect x="667.0" y="123" width="96" height="24" rx="12" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
<text x="715" y="139" font-size="11" fill="#22c55e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CACHED</text>
<rect x="30" y="156" width="340" height="30" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/><text x="44" y="176" font-size="13" fill="#e2e8f0" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COPY requirements.txt .</text>
<rect x="470" y="156" width="190" height="30" rx="6" fill="#111c33" stroke="#22c55e" stroke-width="2"/><text x="565" y="176" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">couche 3</text>
<line x1="372" y1="171" x2="468" y2="171" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ag)"/>
<rect x="667.0" y="159" width="96" height="24" rx="12" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
<text x="715" y="175" font-size="11" fill="#22c55e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CACHED</text>
<rect x="30" y="192" width="340" height="30" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/><text x="44" y="212" font-size="13" fill="#e2e8f0" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RUN pip install -r requirements.txt</text>
<rect x="470" y="192" width="190" height="30" rx="6" fill="#111c33" stroke="#22c55e" stroke-width="2"/><text x="565" y="212" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">couche 4</text>
<line x1="372" y1="207" x2="468" y2="207" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ag)"/>
<rect x="667.0" y="195" width="96" height="24" rx="12" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
<text x="715" y="211" font-size="11" fill="#22c55e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CACHED</text>
<rect x="30" y="228" width="340" height="30" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/><text x="44" y="248" font-size="13" fill="#e2e8f0" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COPY . .</text>
<rect x="470" y="228" width="190" height="30" rx="6" fill="#111c33" stroke="#f59e0b" stroke-width="2"/><text x="565" y="248" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">couche 5</text>
<line x1="372" y1="243" x2="468" y2="243" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#am)"/>
<rect x="667.0" y="231" width="96" height="24" rx="12" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
<text x="715" y="247" font-size="11" fill="#f59e0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reconstruit</text>
<rect x="30" y="264" width="340" height="30" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/><text x="44" y="284" font-size="13" fill="#e2e8f0" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CMD [&quot;python&quot;, &quot;app.py&quot;]</text>
<rect x="470" y="264" width="190" height="30" rx="6" fill="#111c33" stroke="#f59e0b" stroke-width="2"/><text x="565" y="284" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">couche 6</text>
<line x1="372" y1="279" x2="468" y2="279" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#am)"/>
<rect x="667.0" y="267" width="96" height="24" rx="12" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
<text x="715" y="283" font-size="11" fill="#f59e0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reconstruit</text>
<text x="400" y="312" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">Modifier app.py invalide « COPY . . » et tout ce qui suit : le reste vient du cache.</text>

</svg>
