<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Inscriptions du Club Photo</title>
  </head>

    <p class="places">Places restantes : <span id="compteur">20</span></p>

    <p id="message"></p>

    <script src="app.js"></script>
  </body>
</html>
