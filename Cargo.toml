[workspace]
resolver = "2"
members = ["crates/mentor-core", "crates/mentor-content"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/PhilippeVienne/mentor"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
thiserror = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
