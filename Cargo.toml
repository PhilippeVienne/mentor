[workspace]
resolver = "2"
members = ["crates/mentor-core", "crates/mentor-content", "crates/mentor-db", "crates/mentor-cli", "crates/mentor-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/PhilippeVienne/mentor"

[workspace.dependencies]
askama = "0.14"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.12"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
