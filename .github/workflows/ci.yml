name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, Clippy and tests
    runs-on: ubuntu-latest

    services:
      # The database tests need a real PostgreSQL (16 or later) and a superuser connection: they create one
      # database per test and the roles that row-level security is checked against.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: mentor-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Without this variable the database tests skip themselves and the run would be green for nothing.
      MENTOR_TEST_DATABASE_URL: postgres://postgres:mentor-test@127.0.0.1:5432/postgres

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  scripts:
    name: Browser scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check script syntax
        run: |
          for script in static/js/*.js; do
            node --check "$script"
          done
